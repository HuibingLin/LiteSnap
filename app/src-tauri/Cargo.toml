[package]
name = "litesnap"
version = "2.0.1"
description = "A lightweight native screenshot utility"
authors = ["LiteSnap"]
edition = "2024"

[lib]
name = "litesnap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
arboard = "3.6"
base64 = "0.22"
directories = "6"
image = { version = "0.24", default-features = false, features = ["png"] }
rfd = "0.15"
screenshots = "0.8.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-global-shortcut = "2.3"
